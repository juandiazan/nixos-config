# Explicit encoding so glyrc/metaflac/cdparanoia agree on non-ASCII names.
export LC_ALL=en_GB.UTF-8

# --- metadata ---------------------------------------------------------
CDDBMETHOD=musicbrainz
NOSUBMIT=y

# --- output -----------------------------------------------------------
OUTPUTTYPE=flac
FLACENCODERSYNTAX=default
OUTPUTDIR="$HOME/Music"

# flac 1.5.0: silent, max compression, exhaustive search, verify, 3 threads.
# -V decodes each file while encoding and compares against the source
FLACOPTS='-s -8pV -j3'

# --- ripping ----------------------------------------------------------
CDROM=/dev/sr0
CDROMREADERSYNTAX=cdparanoia
MAXPROCS=4
CDPARANOIAOPTS="--never-skip=5"

# --- file layout ------------------------------------------------------
PADTRACKS=y
OUTPUTFORMAT='${ARTISTFILE}/${ALBUMFILE}/${TRACKNUM}.${TRACKFILE}'
VAOUTPUTFORMAT='Various Artists/${ALBUMFILE}/${TRACKNUM}.${ARTISTFILE}-${TRACKFILE}'

# Keep spaces in filenames instead of abcde's default underscores, to match
# the rest of the library. This overrides the built-in mungefilename();
# the only change from the original is dropping its 's/ /_/g'. The leading
# 's/^\.*//' (no hidden files) and the tr (strip filesystem-hostile and
# control chars) are kept as-is. Trailing dots and spaces are also dropped:
# the Y1's FAT card can't store them, so a folder like "I." becomes "I" there
# and `sync-y1 --delete` would delete and re-copy it on every run.
mungefilename () {
    echo "$@" | sed -e 's/^\.*//' -e 's/[. ]*$//' | tr -d ":><|*/\"'?[:cntrl:]"
}

# Playlist beside the album rather than loose in $OUTPUTDIR.
PLAYLISTFORMAT='${ARTISTFILE}/${ALBUMFILE}/${ALBUMFILE}.${OUTPUT}.m3u'
VAPLAYLISTFORMAT='Various Artists/${ALBUMFILE}/${ALBUMFILE}.${OUTPUT}.m3u'

# --- album art (glyr installed) ---------------------------------------
# getalbumart writes cover.jpg beside the album; post_encode embeds it.
ALBUMARTFILE="cover.jpg"
ALBUMARTTYPE="JPEG"

CONVERTOPTS="-resize 800x800> -interlace none"
ALBUMARTALWAYSCONVERT="y"

# --- workflow ---------------------------------------------------------
ACTIONS=default,playlist,getalbumart
EJECTCD=y

# --- after encoding ---------------------------------------------------
# abcde calls this once the tracks are in the album folder. It replaces
# abcde's embedalbumart action, which embeds into every .flac already in
# the folder (even ones that have art) and then moves cover.jpg into
# albumart_backup/. Rockbox ignores art embedded in FLAC and only shows a
# cover.jpg beside the tracks. Every step only fills in what a track is
# missing.
post_encode ()
{
    local dir f ALBUMFILE ARTISTFILE
    ALBUMFILE="$(mungealbumname "$DALBUM")"
    ARTISTFILE="$(mungeartistname "$DARTIST")"
    if [ "$VARIOUSARTISTS" = "y" ]; then
        dir="$(dirname "$OUTPUTDIR/$(eval echo \""$VAOUTPUTFORMAT"\")")"
    else
        dir="$(dirname "$OUTPUTDIR/$(eval echo \""$OUTPUTFORMAT"\")")"
    fi
    if [ ! -d "$dir" ]; then
        log warning "post_encode: $dir not found, skipping album tags and art"
        return 0
    fi

    for f in "$dir"/*.flac; do
        [ -e "$f" ] || continue
        if [ -z "$($METAFLAC --show-tag=ALBUMARTIST "$f")" ]; then
            $METAFLAC --set-tag="ALBUMARTIST=$DARTIST" "$f"
        fi
        if [ -f "$dir/$ALBUMARTFILE" ] && [ -z "$($METAFLAC --list --block-type=PICTURE "$f")" ]; then
            $METAFLAC --import-picture-from="$dir/$ALBUMARTFILE" "$f"
        fi
    done
}
