# Explicit encoding so glyrc/metaflac/cdparanoia agree on non-ASCII names.
export LC_ALL=en_GB.UTF-8

# --- metadata ---------------------------------------------------------
CDDBMETHOD=musicbrainz
NOSUBMIT=y

# --- output -----------------------------------------------------------
OUTPUTTYPE=flac
FLACENCODERSYNTAX=default
OUTPUTDIR="$HOME/Music"

# flac 1.5.0: silent, max compression, exhaustive search, verify, 3 threads.
# -V decodes each file while encoding and compares against the source
FLACOPTS='-s -8pV -j3'

# --- ripping ----------------------------------------------------------
CDROM=/dev/sr0
CDROMREADERSYNTAX=cdparanoia
MAXPROCS=4
CDPARANOIAOPTS="--never-skip=5"

# --- file layout ------------------------------------------------------
PADTRACKS=y
OUTPUTFORMAT='${ARTISTFILE}/${ALBUMFILE}/${TRACKNUM}.${TRACKFILE}'
VAOUTPUTFORMAT='Various Artists/${ALBUMFILE}/${TRACKNUM}.${ARTISTFILE}-${TRACKFILE}'

# Keep spaces in filenames instead of abcde's default underscores, to match
# the rest of the library. This overrides the built-in mungefilename();
# the only change from the original is dropping its 's/ /_/g'. The leading
# 's/^\.*//' (no hidden files) and the tr (strip filesystem-hostile and
# control chars) are kept as-is.
mungefilename () {
    echo "$@" | sed -e 's/^\.*//' | tr -d ":><|*/\"'?[:cntrl:]"
}

# Playlist beside the album rather than loose in $OUTPUTDIR.
PLAYLISTFORMAT='${ARTISTFILE}/${ALBUMFILE}/${ALBUMFILE}.${OUTPUT}.m3u'
VAPLAYLISTFORMAT='Various Artists/${ALBUMFILE}/${ALBUMFILE}.${OUTPUT}.m3u'

# --- album art (glyr installed) ---------------------------------------
# embedalbumart implies getalbumart: writes cover.jpg beside the album
# and embeds it in every track.
ALBUMARTFILE="cover.jpg"
ALBUMARTTYPE="JPEG"

# Shrink-only cap. Art is duplicated into every track, so an uncapped
# 3 MB cover costs ~36 MB on a 12-track album.
CONVERTOPTS="-resize 800x800>"
ALBUMARTALWAYSCONVERT="y"

# --- workflow ---------------------------------------------------------
ACTIONS=default,playlist,embedalbumart
EJECTCD=y
